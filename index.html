<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FBEAF0">
<title>준수의 근무표</title>
<style>
body{margin:0;background:#FFF8FA;font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#2C2C2A}
.wrap{max-width:680px;margin:0 auto;padding:12px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dw{text-align:center;font-size:13px;color:#5F5E5A;padding:4px 0}
.cell{min-height:84px;border-radius:12px;padding:3px;display:flex;flex-direction:column;align-items:center;gap:1px;overflow:hidden}
.num{font-size:12px;align-self:flex-start;font-weight:600}
.hn{font-size:10px;color:#A32D2D;background:#FCEBEB;border-radius:6px;padding:0 3px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:11px;font-weight:600;border-radius:999px;padding:0 6px;white-space:nowrap}
.cell svg{width:30px;height:30px}
.day{background:#FAEEDA;border:1px dashed #EF9F27;color:#633806}
.ngt{background:#EEEDFE;border:1px dashed #AFA9EC;color:#3C3489}
.off{background:#E1F5EE;border:1px dashed #5DCAA5;color:#085041}
.rest{background:#FBEAF0;border:1px dashed #ED93B1;color:#72243E}
.red .num{color:#E24B4A}
.today{border:3px solid #D4537E}
.lg{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px 3px 4px}
.nav{display:flex;align-items:center;justify-content:space-between;margin:16px 0 10px}
button{font-size:14px;border:1px solid #ED93B1;background:#fff;color:#72243E;border-radius:999px;padding:6px 12px}
</style>
</head>
<body>
<div class="wrap">
<svg width="100%" viewBox="0 0 680 120">
<path d="M20 12 Q340 50 660 12" fill="none" stroke="#B4B2A9" stroke-width="1"/>
<polygon points="60,18 84,22 70,44" fill="#F4C0D1"/><polygon points="130,25 154,28 140,50" fill="#FAC775"/><polygon points="200,31 224,33 210,55" fill="#CECBF6"/><polygon points="270,34 294,35 280,57" fill="#9FE1CB"/><polygon points="386,35 410,34 400,57" fill="#F4C0D1"/><polygon points="456,33 480,31 470,55" fill="#FAC775"/><polygon points="526,28 550,25 540,50" fill="#CECBF6"/><polygon points="596,22 620,18 610,44" fill="#9FE1CB"/>
<g fill="#E6F1FB" stroke="#85B7EB"><path d="M40 98 a12 12 0 0 1 14 -14 a16 16 0 0 1 30 4 a10 10 0 0 1 4 10 z"/><path d="M590 98 a12 12 0 0 1 14 -14 a16 16 0 0 1 30 4 a10 10 0 0 1 4 10 z"/></g>
<g fill="#FAC775"><path d="M120 80 l3 6 6 1 -5 4 1 6 -5 -3 -5 3 1 -6 -5 -4 6 -1z"/><path d="M552 72 l3 6 6 1 -5 4 1 6 -5 -3 -5 3 1 -6 -5 -4 6 -1z"/></g>
<g fill="#ED93B1"><path d="M160 100 c-4 -5 -11 0 -6 5 l6 5 6 -5 c5 -5 -2 -10 -6 -5z"/><path d="M515 103 c-4 -5 -11 0 -6 5 l6 5 6 -5 c5 -5 -2 -10 -6 -5z"/></g>
<rect x="200" y="66" width="280" height="44" rx="22" fill="#FBEAF0" stroke="#ED93B1" stroke-width="1.5"/>
<text x="340" y="95" text-anchor="middle" font-size="22" font-weight="600" fill="#72243E">준수의 근무표</text>
</svg>
<div id="todayCard" style="border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:12px;margin-top:6px"></div>
<div class="nav"><button id="prev">이전 달</button><span id="mtitle" style="font-size:18px;font-weight:600"></span><button id="next">다음 달</button></div>
<div style="text-align:center;margin:-4px 0 10px"><button id="goToday">오늘로 가기</button></div>
<div class="cal" id="cal"></div>
<div style="display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:14px 0 0" id="lg"></div>
<div id="hlist" style="margin:12px 0 20px;font-size:13px;color:#5F5E5A;text-align:center"></div>
</div>
<script>
(function(){
var art={
day:'<svg viewBox="0 0 40 40"><g stroke="#EF9F27" stroke-width="2" stroke-linecap="round"><line x1="20" y1="2" x2="20" y2="6"/><line x1="20" y1="34" x2="20" y2="38"/><line x1="2" y1="20" x2="6" y2="20"/><line x1="34" y1="20" x2="38" y2="20"/><line x1="7" y1="7" x2="10" y2="10"/><line x1="30" y1="30" x2="33" y2="33"/><line x1="33" y1="7" x2="30" y2="10"/><line x1="7" y1="33" x2="10" y2="30"/></g><circle cx="20" cy="20" r="11" fill="#FAC775" stroke="#BA7517"/><circle cx="16" cy="18" r="1.4" fill="#633806"/><circle cx="24" cy="18" r="1.4" fill="#633806"/><path d="M16.5 22.5 Q20 26 23.5 22.5" fill="none" stroke="#633806" stroke-width="1.3" stroke-linecap="round"/><circle cx="13.5" cy="22" r="2" fill="#F0997B"/><circle cx="26.5" cy="22" r="2" fill="#F0997B"/></svg>',
ngt:'<svg viewBox="0 0 40 40"><path d="M22 6 A14 14 0 1 0 32 30 A11 11 0 1 1 22 6Z" fill="#CECBF6" stroke="#534AB7"/><path d="M11 20 q2 2 4 0" fill="none" stroke="#3C3489" stroke-width="1.3" stroke-linecap="round"/><circle cx="12" cy="24" r="1.8" fill="#ED93B1"/><path d="M27 5 h5 l-5 5 h5 M33 13 h4 l-4 4 h4" fill="none" stroke="#7F77DD" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>',
off:'<svg viewBox="0 0 40 40"><path d="M14 6 q-2 3 0 6 M20 4 q-2 3 0 6 M26 6 q-2 3 0 6" fill="none" stroke="#5DCAA5" stroke-width="1.5" stroke-linecap="round"/><path d="M9 15 h22 v12 a7 7 0 0 1 -7 7 h-8 a7 7 0 0 1 -7 -7z" fill="#9FE1CB" stroke="#0F6E56"/><path d="M31 18 a4 4 0 0 1 0 8" fill="none" stroke="#0F6E56" stroke-width="2"/><circle cx="16" cy="22" r="1.3" fill="#085041"/><circle cx="24" cy="22" r="1.3" fill="#085041"/><path d="M18 25 q2 2 4 0" fill="none" stroke="#085041" stroke-width="1.2" stroke-linecap="round"/><circle cx="13" cy="25" r="1.6" fill="#F0997B"/><circle cx="27" cy="25" r="1.6" fill="#F0997B"/></svg>',
rest:'<svg viewBox="0 0 40 40"><path d="M8 14 L10 4 L17 10 Q20 9 23 10 L30 4 L32 14 Q36 22 30 30 Q20 36 10 30 Q4 22 8 14Z" fill="#F4C0D1" stroke="#993556"/><path d="M13 20 q2 2 4 0 M23 20 q2 2 4 0" fill="none" stroke="#72243E" stroke-width="1.3" stroke-linecap="round"/><path d="M19 24 h2 l-1 1.5z" fill="#72243E"/><path d="M18 26.5 q2 1.5 4 0" fill="none" stroke="#72243E" stroke-width="1" stroke-linecap="round"/><circle cx="12" cy="25" r="2" fill="#ED93B1"/><circle cx="28" cy="25" r="2" fill="#ED93B1"/><path d="M4 23 h6 M4 27 l6 -1 M36 23 h-6 M36 27 l-6 -1" stroke="#993556" stroke-width="0.8"/></svg>'};
var keys=['day','ngt','off','rest'];
var lbl={day:'주간',ngt:'야간',off:'비번',rest:'휴무'};
var msg={day:'해님이랑 같이 힘내는 날이에요',ngt:'달님이랑 밤 근무하는 날이에요',off:'아침에 퇴근해요, 푹 자요',rest:'꿀잠 자고 푹 쉬는 날이에요'};
var col={day:['#FAEEDA','#633806','#EF9F27'],ngt:['#EEEDFE','#3C3489','#AFA9EC'],off:['#E1F5EE','#085041','#5DCAA5'],rest:['#FBEAF0','#72243E','#ED93B1']};
var wd=['일','월','화','수','목','금','토'];
var H={'2026-1-1':'신정','2026-2-16':'설날 연휴','2026-2-17':'설날','2026-2-18':'설날 연휴','2026-3-1':'삼일절','2026-3-2':'대체공휴일','2026-5-1':'노동절','2026-5-5':'어린이날','2026-5-24':'부처님오신날','2026-5-25':'대체공휴일','2026-6-3':'지방선거일','2026-6-6':'현충일','2026-7-17':'제헌절','2026-8-15':'광복절','2026-8-17':'대체공휴일','2026-9-24':'추석 연휴','2026-9-25':'추석','2026-9-26':'추석 연휴','2026-10-3':'개천절','2026-10-5':'대체공휴일','2026-10-9':'한글날','2026-12-25':'성탄절',
'2027-1-1':'신정','2027-2-6':'설날 연휴','2027-2-7':'설날','2027-2-8':'설날 연휴','2027-2-9':'대체공휴일','2027-3-1':'삼일절','2027-5-1':'노동절','2027-5-3':'대체공휴일','2027-5-5':'어린이날','2027-5-13':'부처님오신날','2027-6-6':'현충일','2027-7-17':'제헌절','2027-7-19':'대체공휴일','2027-8-15':'광복절','2027-8-16':'대체공휴일','2027-9-14':'추석 연휴','2027-9-15':'추석','2027-9-16':'추석 연휴','2027-10-3':'개천절','2027-10-4':'대체공휴일','2027-10-9':'한글날','2027-10-11':'대체공휴일','2027-12-25':'성탄절','2027-12-27':'대체공휴일'};
var base=Date.UTC(2026,9,27);
function shift(y,m,d){var diff=Math.round((Date.UTC(y,m,d)-base)/86400000);return keys[((diff%4)+4)%4];}
var now=new Date(Date.now()+9*3600000);
var ty=now.getUTCFullYear(),tm=now.getUTCMonth(),td=now.getUTCDate();
var vy=ty,vm=tm;
function todayCard(){
var k=shift(ty,tm,td),c=col[k];
var tw=new Date(Date.UTC(ty,tm,td+1));var k2=shift(tw.getUTCFullYear(),tw.getUTCMonth(),tw.getUTCDate());
var hol=H[ty+'-'+(tm+1)+'-'+td];
var el=document.getElementById('todayCard');
el.style.background=c[0];el.style.border='1.5px solid '+c[2];el.style.color=c[1];
el.innerHTML='<div style="width:60px;height:60px;flex:none">'+art[k].replace('<svg ','<svg width="60" height="60" ')+'</div>'+
'<div style="flex:1;min-width:0"><div style="font-size:13px">오늘 '+(tm+1)+'월 '+td+'일 ('+wd[new Date(Date.UTC(ty,tm,td)).getUTCDay()]+')'+(hol?' · '+hol:'')+'</div>'+
'<div style="font-size:22px;font-weight:700;margin:2px 0">'+lbl[k]+' 근무</div><div style="font-size:13px">'+msg[k]+'</div></div>'+
'<div style="text-align:center;font-size:12px;background:#fff;color:#5F5E5A;border-radius:12px;padding:6px 10px">내일<br><b style="font-size:15px;color:'+col[k2][1]+'">'+lbl[k2]+'</b></div>';}
function render(){
document.getElementById('mtitle').textContent=vy+'년 '+(vm+1)+'월';
var h='<div class="dw" style="color:#E24B4A">일</div><div class="dw">월</div><div class="dw">화</div><div class="dw">수</div><div class="dw">목</div><div class="dw">금</div><div class="dw" style="color:#378ADD">토</div>';
var first=new Date(Date.UTC(vy,vm,1)).getUTCDay();
var days=new Date(Date.UTC(vy,vm+1,0)).getUTCDate();
for(var i=0;i<first;i++){h+='<div></div>';}
var hl=[];
for(var d=1;d<=days;d++){
var k=shift(vy,vm,d),hn=H[vy+'-'+(vm+1)+'-'+d],dow=(first+d-1)%7,isT=(vy===ty&&vm===tm&&d===td);
if(hn){hl.push(d+'일 '+hn);}
h+='<div class="cell '+k+((hn||dow===0)?' red':'')+(isT?' today':'')+'"><span class="num">'+d+(isT?' 오늘':'')+'</span>'+(hn?'<span class="hn">'+hn+'</span>':'')+art[k]+'<span class="tag">'+lbl[k]+'</span></div>';}
document.getElementById('cal').innerHTML=h;
var hle=document.getElementById('hlist');
if(vy<2026||vy>2027){hle.textContent='이 달은 공휴일 정보가 아직 없어요 (2026~2027년만 들어 있어요)';}
else if(hl.length){hle.textContent='이달의 공휴일: '+hl.join(', ');}
else{hle.textContent='이달은 공휴일이 없어요';}}
document.getElementById('prev').onclick=function(){vm--;if(vm<0){vm=11;vy--;}render();};
document.getElementById('next').onclick=function(){vm++;if(vm>11){vm=0;vy++;}render();};
document.getElementById('goToday').onclick=function(){vy=ty;vm=tm;render();};
var L=document.getElementById('lg');
keys.forEach(function(k){var s=document.createElement('span');s.className='lg';s.style.background=col[k][0];s.style.color=col[k][1];
s.innerHTML=art[k].replace('<svg ','<svg width="22" height="22" ')+(k==='off'?'비번 (아침 퇴근)':lbl[k]);L.appendChild(s);});
todayCard();render();
})();
</script>
</body>
</html>
<!-- 준수 근무표 -->
